openapi: 3.0.3
info:
  title: ShopFloor OS
  version: 0.1.0
  license:
    name: MIT
servers:
  - url: http://localhost:8787
paths:
  /health:
    get:
      security: []
      responses:
        "200":
          description: process up
  /v1/me:
    get:
      responses:
        "200":
          description: identity and capability map for the bearer token
          content:
            application/json:
              schema:
                type: object
                required: [userId, plantId, role, can]
                properties:
                  userId: { type: string }
                  plantId: { type: string }
                  role:
                    type: string
                    enum: [operator, supervisor, planner, auditor]
                  can:
                    type: object
                    additionalProperties:
                      type: boolean
  /v1/commands/run.start:
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId, workOrderId, operationId]
              properties:
                assetId: { type: string }
                workOrderId: { type: string }
                operationId: { type: string }
      responses:
        "200":
          description: event appended or idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
  /v1/commands/qty.scrap:
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId, workOrderId, operationId, qty, reasonCode]
              properties:
                assetId: { type: string }
                workOrderId: { type: string }
                operationId: { type: string }
                qty: { type: integer, minimum: 1 }
                reasonCode: { type: string }
      responses:
        "200":
          description: scrap recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
  /v1/commands/downtime.start:
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId, reasonCode]
              properties:
                assetId: { type: string }
                reasonCode: { type: string }
      responses:
        "200":
          description: downtime opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
  /v1/commands/run.complete:
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId]
              properties:
                assetId: { type: string }
      responses:
        "200":
          description: run closed, lock released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
  /v1/commands/run.pause:
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId]
              properties:
                assetId: { type: string }
      responses:
        "200":
          description: run paused; lock remains
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
  /v1/commands/run.resume:
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId]
              properties:
                assetId: { type: string }
      responses:
        "200":
          description: run resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
  /v1/commands/qty.good:
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId, workOrderId, operationId, qty]
              properties:
                assetId: { type: string }
                workOrderId: { type: string }
                operationId: { type: string }
                qty: { type: integer, minimum: 1 }
      responses:
        "200":
          description: good qty recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
  /v1/commands/downtime.end:
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId]
              properties:
                assetId: { type: string }
      responses:
        "200":
          description: downtime closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
  /v1/commands/handoff.submit:
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromShift, toShift]
              properties:
                fromShift: { type: string }
                toShift: { type: string }
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: handoff offered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
  /v1/commands/handoff.accept:
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromShift, toShift]
              properties:
                fromShift: { type: string }
                toShift: { type: string }
      responses:
        "200":
          description: handoff accepted (supervisor/planner)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
  /v1/commands/handoff.override:
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromShift, toShift, reason]
              properties:
                fromShift: { type: string }
                toShift: { type: string }
                reason: { type: string }
      responses:
        "200":
          description: pending handoff cleared without accept
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
  /v1/catalog/assets:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                id: { type: string }
                code: { type: string }
                name: { type: string }
      responses:
        "200":
          description: asset created (planner)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResult"
  /v1/catalog/reason-codes:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, code, label]
              properties:
                id: { type: string }
                kind:
                  type: string
                  enum: [downtime, scrap]
                code: { type: string }
                label: { type: string }
      responses:
        "200":
          description: reason code created (planner)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResult"
  /v1/catalog/work-orders:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, targetQty]
              properties:
                id: { type: string }
                code: { type: string }
                targetQty: { type: integer, minimum: 0 }
                dueAt: { type: string, format: date-time }
      responses:
        "200":
          description: work order created; emits work_order.opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrderIdResult"
  /v1/catalog/operations:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workOrderId, seq, name]
              properties:
                id: { type: string }
                workOrderId: { type: string }
                seq: { type: integer, minimum: 1 }
                name: { type: string }
                defaultAssetId: { type: string }
      responses:
        "200":
          description: routing step created (planner)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResult"
  /v1/catalog/shifts:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                id: { type: string }
                code: { type: string }
                name: { type: string }
                startsAt: { type: string }
                endsAt: { type: string }
      responses:
        "200":
          description: shift created (planner)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResult"
  /v1/commands/record.correct:
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [replacesEventId, reason]
              properties:
                replacesEventId: { type: string }
                reason: { type: string }
      responses:
        "200":
          description: correction appended; original row unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
  /v1/tape:
    get:
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: plant event tape (auditor bearer only)
        "403":
          description: non-auditor
  /v1/floor:
    get:
      responses:
        "200":
          description: plant board payload
  /v1/plants/{plantId}/assets/{assetId}/live:
    get:
      parameters:
        - name: plantId
          in: path
          required: true
          schema: { type: string }
        - name: assetId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: open run and downtime
  /v1/work-orders/{id}/timeline:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: event stream for a work order
  /v1/metrics/oee:
    get:
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: asset
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OEE-lite for one asset, or assets[] when asset is omitted. Null factors are omitted math, not zero.
        "400":
          description: missing or inverted window
        "404":
          description: unknown asset
  /v1/export/events.csv:
    get:
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: raw event log as CSV; voided qty rows are still present
          content:
            text/csv:
              schema: { type: string }
components:
  schemas:
    CommandResult:
      type: object
      description: Result of an append-only command. replayed is true when the Idempotency-Key matched a prior request.
      required: [eventId, replayed]
      properties:
        eventId: { type: string }
        replayed: { type: boolean }
    IdResult:
      type: object
      description: Result of a planner catalog write that returns an id.
      required: [id]
      properties:
        id: { type: string }
    WorkOrderIdResult:
      type: object
      description: Result of creating a work order; also emits work_order.opened.
      required: [id, eventId]
      properties:
        id: { type: string }
        eventId: { type: string }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
security:
  - bearer: []
